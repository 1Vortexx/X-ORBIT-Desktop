<script>
  // Trackly — local music player. Tracks and playlists are kept in this browser's
  // IndexedDB (the files never leave the device) so they survive a reload.
  const DB_NAME = "xorbit-trackly";
  const SETTINGS_KEY = "xorbit_trackly_settings";

  const $ = (id) => document.getElementById(id);
  const $$ = (sel) => document.querySelectorAll(sel);
  const audio = new Audio();
  audio.preload = "auto";

  // tracks: { id, name, duration, added, title, artist, album, albumArtist, trackNo, year, art, tagged }
  // (blobs stay in the DB until played; records from before tags were read only have the first four)
  let tracks = [];
  let trackMap = new Map();
  let playlists = [];        // { id, name, trackIds, created }
  let view = "songs";        // songs | albums | artists | recent | album:<key> | artist:<key> | pl:<id>
  let search = "";
  let sort;                  // undefined = the view's default order, null = custom order, or { key, dir }
  let selectedId = null;
  let visibleIds = [];       // song ids the open list shows, in order
  let cards = [];            // album/artist cards on screen, indexed by data-i

  // Playback: the list playback started from (in play order), plus songs queued by hand
  let ctx = { source: null, base: [], order: [] };
  let ctxIndex = -1;
  let upNext = [];
  let currentId = null;
  let currentUrl = null;
  let loadToken = 0;
  let pendingSeek = 0;
  let shuffle = false;
  let repeat = "off";        // off | all | one
  let volume = 80;
  let lastVolume = 80;
  let seeking = false;
  const inDesktop = parent !== window;   // running in an X-ORBIT window (menu bar Now Playing)
  let nowTimer = null;

  // ── IndexedDB ──
  let dbPromise = null;
  function db() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 2);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains("tracks")) d.createObjectStore("tracks", { keyPath: "id" });
          if (!d.objectStoreNames.contains("playlists")) d.createObjectStore("playlists", { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }
  async function tx(store, mode, fn) {
    const d = await db();
    return new Promise((resolve, reject) => {
      const t = d.transaction(store, mode);
      const result = fn(t.objectStore(store));
      t.oncomplete = () => resolve(result && "result" in result ? result.result : undefined);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  async function loadAll(store, pick) {
    const d = await db();
    return new Promise((resolve, reject) => {
      const out = [];
      const req = d.transaction(store).objectStore(store).openCursor();
      req.onsuccess = () => {
        const c = req.result;
        if (!c) return resolve(out);
        out.push(pick(c.value));
        c.continue();
      };
      req.onerror = () => reject(req.error);
    });
  }
  const getRecord = (id) => tx("tracks", "readonly", (s) => s.get(id));
  const getBlob = (id) => getRecord(id).then((r) => r && r.blob);
  const savePlaylist = (pl) => tx("playlists", "readwrite", (s) => s.put(pl)).catch(() => toast("Couldn't save the playlist"));

  // ── Helpers ──
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const playlistById = (id) => playlists.find((p) => p.id === id);
  const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const cmp = (a, b) => String(a).localeCompare(String(b), undefined, { sensitivity: "base", numeric: true });
  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
  }
  function fmtTotal(sec) {
    return sec >= 3600
      ? Math.floor(sec / 3600) + " hr " + Math.round((sec % 3600) / 60) + " min"
      : Math.max(1, Math.round(sec / 60)) + " min";
  }
  function readDuration(blob) {
    return new Promise((resolve) => {
      const a = new Audio();
      const url = URL.createObjectURL(blob);
      const done = (d) => { URL.revokeObjectURL(url); resolve(d); };
      a.preload = "metadata";
      a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 0);
      a.onerror = () => done(null);
      a.src = url;
    });
  }
  let toastTimer;
  function toast(msg, ms) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), ms || 2200);
  }
  function setRangeFill(el) {
    el.style.setProperty("--pct", (el.value / el.max) * 100 + "%");
  }

  // "Artist - Title" from a file name. Old records keep the name without its extension.
  function fromName(name, isFileName) {
    let base = String(name || "");
    if (isFileName) base = base.replace(/\.[^.]+$/, "");
    base = base.replace(/_/g, " ").replace(/^\d{1,3}\s*[.\-]\s+/, "").trim();
    const parts = base.split(/\s+[-–—]\s+/);
    if (parts.length >= 2 && parts[0].trim()) return { artist: parts[0].trim(), title: parts.slice(1).join(" - ").trim() };
    return { artist: "", title: base || String(name || "Untitled") };
  }

  const tTitle = (t) => t.title || t.name || "Untitled";
  const tArtist = (t) => t.artist || "Unknown Artist";
  const tAlbum = (t) => t.album || "Unknown Album";
  const tAlbumArtist = (t) => t.albumArtist || t.artist || "Unknown Artist";
  const albumKey = (t) => (t.album ? (tAlbumArtist(t) + "\t" + t.album).toLowerCase() : "\t");
  const artistKey = (t) => tArtist(t).toLowerCase();

  // Artwork: the embedded picture, or a colour made from the album/title
  const artUrls = new Map();
  function artUrl(t) {
    if (!t || !t.art) return null;
    let u = artUrls.get(t.id);
    if (!u) { u = URL.createObjectURL(t.art); artUrls.set(t.id, u); }
    return u;
  }
  function dropArtUrl(id) {
    const u = artUrls.get(id);
    if (u) { URL.revokeObjectURL(u); artUrls.delete(id); }
  }
  function hue(str) {
    let h = 7;
    for (const ch of String(str)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return h % 360;
  }
  const gradient = (key) => {
    const h = hue(key);
    return `linear-gradient(135deg, hsl(${h} 56% 46%), hsl(${(h + 50) % 360} 60% 22%))`;
  };
  const placeholderKey = (t) => (t.album ? albumKey(t) : tTitle(t));
  function artHtml(t, key, icon) {
    const u = artUrl(t);
    if (u) return `<div class="art"><img src="${u}" alt="" loading="lazy" draggable="false"></div>`;
    return `<div class="art" style="background:${gradient(key != null ? key : t ? placeholderKey(t) : "")}"><i class="fas ${icon || "fa-music"}"></i></div>`;
  }

  // ── Reading tags (ID3v2.2/2.3/2.4, found in MP3s) ──
  const syncsafe = (b, i) => ((b[i] & 0x7f) << 21) | ((b[i + 1] & 0x7f) << 14) | ((b[i + 2] & 0x7f) << 7) | (b[i + 3] & 0x7f);
  const be32 = (b, i) => ((b[i] << 24) | (b[i + 1] << 16) | (b[i + 2] << 8) | b[i + 3]) >>> 0;
  function unsync(b) {
    const out = new Uint8Array(b.length);
    let n = 0;
    for (let i = 0; i < b.length; i++) {
      out[n++] = b[i];
      if (b[i] === 0xff && b[i + 1] === 0x00) i++;
    }
    return out.subarray(0, n);
  }
  function decodeText(bytes, enc) {
    let label = "latin1";
    if (enc === 3) label = "utf-8";
    else if (enc === 2) label = "utf-16be";
    else if (enc === 1) {
      label = bytes[0] === 0xfe && bytes[1] === 0xff ? "utf-16be" : "utf-16le";
      if ((bytes[0] === 0xff && bytes[1] === 0xfe) || (bytes[0] === 0xfe && bytes[1] === 0xff)) bytes = bytes.subarray(2);
    }
    try { return new TextDecoder(label).decode(bytes); } catch (e) { return ""; }
  }
  function textFrame(data) {
    if (!data.length) return "";
    const parts = decodeText(data.subarray(1), data[0]).split("\u0000").map((s) => s.replace(/^﻿/, "").trim()).filter(Boolean);
    return parts.join(", ");
  }
  function pictureFrame(data, v22) {
    const enc = data[0];
    let p = 1, mime;
    if (v22) {
      mime = String.fromCharCode(data[1], data[2], data[3]).toLowerCase();
      p = 4;
    } else {
      let end = p;
      while (end < data.length && data[end] !== 0) end++;
      mime = String.fromCharCode(...data.subarray(p, end)).toLowerCase();
      p = end + 1;
    }
    const type = data[p++];
    // Skip the description, which ends with one zero byte (or two for UTF-16)
    if (enc === 1 || enc === 2) {
      while (p + 1 < data.length && !(data[p] === 0 && data[p + 1] === 0)) p += 2;
      p += 2;
    } else {
      while (p < data.length && data[p] !== 0) p++;
      p++;
    }
    if (mime === "-->" || p >= data.length) return null;
    if (!mime.includes("/")) mime = "image/" + mime;
    if (mime === "image/jpg") mime = "image/jpeg";
    return { type, mime, bytes: data.subarray(p) };
  }
  async function readTags(blob) {
    const head = new Uint8Array(await blob.slice(0, 10).arrayBuffer());
    if (head.length < 10 || head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;
    const ver = head[3], flags = head[5];
    if (ver < 2 || ver > 4) return null;
    const size = syncsafe(head, 6);
    if (size <= 0 || size > 32 * 1024 * 1024) return null;
    let buf = new Uint8Array(await blob.slice(10, 10 + size).arrayBuffer());
    if ((flags & 0x80) && ver < 4) buf = unsync(buf);
    let pos = 0;
    if ((flags & 0x40) && ver === 3) pos = 4 + be32(buf, 0);
    else if ((flags & 0x40) && ver === 4) pos = syncsafe(buf, 0);
    const idLen = ver === 2 ? 3 : 4, hdrLen = ver === 2 ? 6 : 10;
    const out = {}, pics = [];
    while (pos + hdrLen <= buf.length) {
      const id = String.fromCharCode(...buf.subarray(pos, pos + idLen));
      if (!/^[A-Z0-9]+$/.test(id)) break;   // reached the padding
      const fsize = ver === 2 ? (buf[pos + 3] << 16) | (buf[pos + 4] << 8) | buf[pos + 5]
        : ver === 4 ? syncsafe(buf, pos + 4) : be32(buf, pos + 4);
      const fflags = ver === 2 ? 0 : buf[pos + 9];
      pos += hdrLen;
      if (fsize <= 0 || pos + fsize > buf.length) break;
      let data = buf.subarray(pos, pos + fsize);
      pos += fsize;
      if (ver === 4) {
        if (fflags & 0x0c) continue;            // compressed or encrypted
        if (fflags & 0x40) data = data.subarray(1);
        if (fflags & 0x01) data = data.subarray(4);
        if (fflags & 0x02) data = unsync(data);
      } else if (ver === 3) {
        if (fflags & 0xc0) continue;            // compressed or encrypted
        if (fflags & 0x20) data = data.subarray(1);
      }
      switch (id) {
        case "TIT2": case "TT2": out.title = textFrame(data); break;
        case "TPE1": case "TP1": out.artist = textFrame(data); break;
        case "TALB": case "TAL": out.album = textFrame(data); break;
        case "TPE2": case "TP2": out.albumArtist = textFrame(data); break;
        case "TRCK": case "TRK": out.trackNo = parseInt(textFrame(data), 10) || 0; break;
        case "TYER": case "TYE": case "TDRC": out.year = parseInt(textFrame(data).slice(0, 4), 10) || 0; break;
        case "APIC": case "PIC": { const pic = pictureFrame(data, id === "PIC"); if (pic) pics.push(pic); break; }
      }
    }
    const pic = pics.find((p) => p.type === 3) || pics[0];
    if (pic && pic.bytes.length > 64 && pic.bytes.length < 8 * 1024 * 1024) out.art = new Blob([pic.bytes], { type: pic.mime });
    return out;
  }
  // Everything Trackly shows about a song: tags first, then the file name
  function describe(tags, name, isFileName) {
    const f = fromName(name, isFileName);
    tags = tags || {};
    return {
      title: tags.title || f.title,
      artist: tags.artist || f.artist || "",
      album: tags.album || "",
      albumArtist: tags.albumArtist || "",
      trackNo: tags.trackNo || 0,
      year: tags.year || 0,
      art: tags.art || null,
      tagged: 1,
    };
  }

  // ── Library groups ──
  let aggCache = null;
  function invalidate() { aggCache = null; }
  function agg() {
    if (aggCache) return aggCache;
    const albums = new Map(), artists = new Map();
    for (const t of tracks) {
      const ak = albumKey(t);
      let a = albums.get(ak);
      if (!a) {
        a = { kind: "album", key: ak, name: t.album || "Unknown Album", artist: t.album ? tAlbumArtist(t) : "", ids: [], art: null, year: 0, artists: new Set() };
        albums.set(ak, a);
      }
      a.ids.push(t.id);
      a.artists.add(tArtist(t));
      if (!a.art && t.art) a.art = t;
      if (!a.year && t.year) a.year = t.year;

      const rk = artistKey(t);
      let r = artists.get(rk);
      if (!r) { r = { kind: "artist", key: rk, name: tArtist(t), ids: [], art: null, albums: new Set() }; artists.set(rk, r); }
      r.ids.push(t.id);
      r.albums.add(ak);
      if (!r.art && t.art) r.art = t;
    }
    for (const a of albums.values()) {
      if (!a.artist) a.artist = a.artists.size === 1 ? [...a.artists][0] : "Various Artists";
    }
    const unknownLast = (x, y) => (x.key === "\t") - (y.key === "\t") || (x.name === "Unknown Artist") - (y.name === "Unknown Artist") || cmp(x.name, y.name);
    aggCache = {
      albums: [...albums.values()].sort(unknownLast),
      artists: [...artists.values()].sort(unknownLast),
      albumMap: albums,
      artistMap: artists,
    };
    return aggCache;
  }

  const byTrackNo = (a, b) => (a.trackNo || 999) - (b.trackNo || 999) || cmp(tTitle(a), tTitle(b));
  // Song ids a view lists, in its natural order
  function viewIds(v) {
    if (v === "songs") return tracks.map((t) => t.id);
    if (v === "recent") return [...tracks].sort((a, b) => (b.added || 0) - (a.added || 0)).map((t) => t.id);
    if (v.startsWith("pl:")) {
      const pl = playlistById(v.slice(3));
      return pl ? pl.trackIds.filter((id) => trackMap.has(id)) : [];
    }
    if (v.startsWith("album:")) {
      const a = agg().albumMap.get(v.slice(6));
      return a ? a.ids.map((id) => trackMap.get(id)).sort(byTrackNo).map((t) => t.id) : [];
    }
    if (v.startsWith("artist:")) {
      const r = agg().artistMap.get(v.slice(7));
      return r ? r.ids.map((id) => trackMap.get(id))
        .sort((a, b) => (b.year || 0) - (a.year || 0) || cmp(tAlbum(a), tAlbum(b)) || byTrackNo(a, b))
        .map((t) => t.id) : [];
    }
    return [];
  }
  function viewName(v) {
    if (!v) return "Trackly";
    if (v === "songs") return "Songs";
    if (v === "recent") return "Recently Added";
    if (v === "albums") return "Albums";
    if (v === "artists") return "Artists";
    if (v.startsWith("pl:")) return (playlistById(v.slice(3)) || {}).name || "Playlist";
    if (v.startsWith("album:")) { const a = agg().albumMap.get(v.slice(6)); return a ? a.name : "Album"; }
    if (v.startsWith("artist:")) { const r = agg().artistMap.get(v.slice(7)); return r ? r.name : "Artist"; }
    if (v === "queue") return "Your queue";
    return "Trackly";
  }
  const defaultSort = (v) => (v === "songs" ? { key: "title", dir: 1 } : null);
  const effectiveSort = () => (sort === undefined ? defaultSort(view) : sort);
  function sortIds(ids, s) {
    if (!s) return ids;
    const key = {
      title: (a, b) => cmp(tTitle(a), tTitle(b)),
      artist: (a, b) => cmp(tArtist(a), tArtist(b)) || cmp(tAlbum(a), tAlbum(b)) || byTrackNo(a, b),
      album: (a, b) => cmp(tAlbum(a), tAlbum(b)) || byTrackNo(a, b),
      dur: (a, b) => (a.duration || 0) - (b.duration || 0),
    }[s.key];
    return ids.map((id) => trackMap.get(id)).sort((a, b) => key(a, b) * s.dir).map((t) => t.id);
  }
  function matches(text) {
    if (!search) return true;
    const hay = text.toLowerCase();
    return search.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
  }
  const songText = (t) => tTitle(t) + " " + tArtist(t) + " " + tAlbum(t);

  // ── Adding files (to the library, and to the open playlist if there is one) ──
  async function addFiles(fileList) {
    const files = [...fileList].filter((f) => f.type.startsWith("audio/") || /\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name));
    if (!files.length) return toast("No audio files found");
    const pl = view.startsWith("pl:") ? playlistById(view.slice(3)) : null;
    let added = 0, skipped = 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (files.length > 2) toast("Adding " + (i + 1) + " of " + files.length + "…", 60000);
      const duration = await readDuration(file);
      if (duration === null) { skipped++; continue; }   // the browser can't decode it
      let tags = null;
      try { tags = await readTags(file); } catch (e) { /* no readable tags */ }
      const info = describe(tags, file.name, true);
      const track = { id: newId(), name: info.title, duration, added: Date.now() + added, ...info };
      try {
        await tx("tracks", "readwrite", (s) => s.put({ ...track, blob: file }));
      } catch (e) {
        toast(e && e.name === "QuotaExceededError" ? "Out of browser storage" : "Couldn't save " + file.name);
        break;
      }
      tracks.push(track);
      trackMap.set(track.id, track);
      if (pl) pl.trackIds.push(track.id);
      added++;
    }
    if (pl && added) await savePlaylist(pl);
    invalidate();
    renderView();
    updatePlayState();
    const where = pl ? " to " + pl.name : "";
    if (added) toast("Added " + plural(added, "song") + where + (skipped ? ", skipped " + skipped : ""));
    else if (skipped) toast("Your browser can't play " + (skipped === 1 ? "that file" : "those files"));
    else $("toast").classList.remove("show");
  }
  $("addBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };

  // Dropping files anywhere in Trackly imports them
  const isFileDrag = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  let dragDepth = 0;
  document.addEventListener("dragenter", (e) => {
    if (!isFileDrag(e)) return;
    dragDepth++;
    const pl = view.startsWith("pl:") ? playlistById(view.slice(3)) : null;
    $("dropText").textContent = pl ? "Drop to add to " + pl.name : "Drop to add to your library";
    $("drop").classList.add("show");
  });
  document.addEventListener("dragleave", (e) => {
    if (!isFileDrag(e)) return;
    if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("show"); }
  });
  document.addEventListener("dragover", (e) => { if (isFileDrag(e)) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth = 0;
    $("drop").classList.remove("show");
    if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ── Menus ──
  let menuEl = null, menuBtn = null;
  function closeMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
    if (menuBtn) { menuBtn.classList.remove("open"); menuBtn = null; }
  }
  // items: { icon, label, fn, danger, check } | "sep" | { heading }
  function openMenu(items, x, y, btn) {
    if (btn && btn === menuBtn) return closeMenu();   // second click on the same button closes it
    closeMenu();
    menuEl = document.createElement("div");
    menuEl.className = "menu";
    for (const it of items) {
      if (it === "sep") { menuEl.insertAdjacentHTML("beforeend", '<div class="menu-sep"></div>'); continue; }
      if (it.heading) { const h = document.createElement("div"); h.className = "menu-label"; h.textContent = it.heading; menuEl.appendChild(h); continue; }
      const b = document.createElement("button");
      b.className = "menu-item" + (it.danger ? " danger" : "");
      b.innerHTML = `<i class="fas ${it.icon || "fa-circle"}"></i><span></span>` + (it.check ? '<i class="fas fa-check check"></i>' : "");
      b.querySelector("span").textContent = it.label;
      b.onclick = () => { closeMenu(); it.fn(); };
      menuEl.appendChild(b);
    }
    document.body.appendChild(menuEl);
    if (btn) { menuBtn = btn; btn.classList.add("open"); }
    const m = menuEl.getBoundingClientRect();
    let left = btn ? btn.getBoundingClientRect().right - m.width : x;
    let top = btn ? btn.getBoundingClientRect().bottom + 4 : y;
    if (top + m.height > innerHeight - 8) {
      top = (btn ? btn.getBoundingClientRect().top - 4 : y) - m.height;
      menuEl.style.transformOrigin = "bottom left";
    }
    menuEl.style.left = Math.max(8, Math.min(left, innerWidth - m.width - 8)) + "px";
    menuEl.style.top = Math.max(8, top) + "px";
  }
  document.addEventListener("mousedown", (e) => {
    if (menuEl && !menuEl.contains(e.target) && e.target.closest(".open") !== menuBtn) closeMenu();
  });
  window.addEventListener("blur", closeMenu);
  window.addEventListener("resize", closeMenu);
  $("content").addEventListener("scroll", () => {
    closeMenu();
    $("topbar").classList.toggle("scrolled", $("content").scrollTop > 2);
  });

  function trackMenu(id, x, y, btn) {
    const t = trackMap.get(id);
    if (!t) return;
    const items = [
      { icon: "fa-play", label: "Play", fn: () => (visibleIds.includes(id) ? playFrom(visibleIds, id, view) : playFrom([id], id, view)) },
      { icon: "fa-arrow-turn-up fa-rotate-90", label: "Play Next", fn: () => queueSongs([id], true) },
      { icon: "fa-list-ul", label: "Add to Queue", fn: () => queueSongs([id], false) },
      "sep",
      { heading: "Add to playlist" },
      ...playlists.map((pl) => {
        const inIt = pl.trackIds.includes(id);
        return { icon: "fa-list", label: pl.name, check: inIt, fn: () => (inIt ? removeFromPlaylist(pl.id, id, true) : addToPlaylist(pl.id, [id])) };
      }),
      { icon: "fa-plus", label: "New playlist…", fn: () => startNewPlaylist([id]) },
      "sep",
      { icon: "fa-compact-disc", label: "Go to Album", fn: () => showView("album:" + albumKey(t)) },
      { icon: "fa-microphone-lines", label: "Go to Artist", fn: () => showView("artist:" + artistKey(t)) },
      "sep",
    ];
    if (view.startsWith("pl:")) items.push({ icon: "fa-minus", label: "Remove from This Playlist", fn: () => removeFromPlaylist(view.slice(3), id) });
    items.push({ icon: "fa-trash-can", label: "Remove from Library", danger: true, fn: () => removeTrack(id, true) });
    openMenu(items, x, y, btn);
  }

  // ── Playlists ──
  function nameEditor(initial, onDone) {
    const input = document.createElement("input");
    input.className = "name-input";
    input.maxLength = 60;
    input.value = initial;
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      onDone(save ? input.value.trim() : null);
    };
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
    setTimeout(() => { input.focus(); input.select(); }, 0);
    return input;
  }
  function startNewPlaylist(thenAdd) {
    openSidebar();
    renderSidebar();
    const input = nameEditor("New Playlist " + (playlists.length + 1), async (name) => {
      if (!name) return renderSidebar();
      const pl = { id: newId(), name, trackIds: thenAdd ? thenAdd.slice() : [], created: Date.now() };
      playlists.push(pl);
      await savePlaylist(pl);
      if (thenAdd) { toast("Added to " + name); renderSidebar(); closeSidebar(); }
      else showView("pl:" + pl.id);
    });
    $("playlistNav").querySelector(".side-empty")?.remove();
    $("playlistNav").appendChild(input);
  }
  $("newPlaylistBtn").onclick = () => startNewPlaylist();

  function renamePlaylist(id, where) {
    const pl = playlistById(id);
    if (!pl) return;
    const target = where || document.querySelector(".hero h1");
    if (!target) return;
    const input = nameEditor(pl.name, async (name) => {
      if (name && name !== pl.name) { pl.name = name; await savePlaylist(pl); }
      renderSidebar();
      if (view === "pl:" + id) renderView();
    });
    target.replaceWith(input);
  }
  async function deletePlaylist(id) {
    const pl = playlistById(id);
    if (!pl || !confirm(`Delete the playlist "${pl.name}"? The songs stay in your library.`)) return;
    await tx("playlists", "readwrite", (s) => s.delete(id));
    playlists = playlists.filter((p) => p.id !== id);
    if (view === "pl:" + id) showView("songs");
    else renderSidebar();
    toast("Deleted " + pl.name);
  }
  async function addToPlaylist(plId, ids) {
    const pl = playlistById(plId);
    if (!pl) return;
    const fresh = ids.filter((id) => !pl.trackIds.includes(id));
    if (!fresh.length) return toast("Already in " + pl.name);
    pl.trackIds.push(...fresh);
    await savePlaylist(pl);
    renderSidebar();
    if (view === "pl:" + plId) renderView();
    toast("Added " + (fresh.length > 1 ? plural(fresh.length, "song") + " " : "") + "to " + pl.name);
  }
  async function removeFromPlaylist(plId, trackId, announce) {
    const pl = playlistById(plId);
    if (!pl) return;
    pl.trackIds = pl.trackIds.filter((id) => id !== trackId);
    await savePlaylist(pl);
    renderSidebar();
    if (view === "pl:" + plId) renderView();
    if (announce) toast("Removed from " + pl.name);
  }
  async function reorderPlaylist(plId, movingId, targetId, after) {
    const pl = playlistById(plId);
    if (!pl || movingId === targetId) return;
    const ids = pl.trackIds.filter((id) => id !== movingId);
    const at = ids.indexOf(targetId);
    if (at < 0) return;
    ids.splice(after ? at + 1 : at, 0, movingId);
    pl.trackIds = ids;
    await savePlaylist(pl);
    renderView();
  }
  function playlistMenu(id, x, y, btn) {
    const ids = viewIds("pl:" + id);
    openMenu([
      { icon: "fa-play", label: "Play", fn: () => ids.length && playFrom(ids, null, "pl:" + id, false) },
      { icon: "fa-shuffle", label: "Shuffle", fn: () => ids.length && playFrom(ids, null, "pl:" + id, true) },
      { icon: "fa-list-ul", label: "Add to Queue", fn: () => ids.length && queueSongs(ids, false) },
      "sep",
      { icon: "fa-pen", label: "Rename", fn: () => { if (view !== "pl:" + id) showView("pl:" + id); renamePlaylist(id); } },
      { icon: "fa-trash-can", label: "Delete Playlist", danger: true, fn: () => deletePlaylist(id) },
    ], x, y, btn);
  }

  // Removing a song from the library takes it out of every playlist and the queue too
  async function removeTrack(id, ask) {
    const t = trackMap.get(id);
    if (!t) return;
    if (ask && !confirm(`Remove "${tTitle(t)}" from Trackly? Your original file isn't touched.`)) return;
    await tx("tracks", "readwrite", (s) => s.delete(id));
    tracks = tracks.filter((x) => x.id !== id);
    trackMap.delete(id);
    dropArtUrl(id);
    for (const pl of playlists) {
      if (pl.trackIds.includes(id)) {
        pl.trackIds = pl.trackIds.filter((x) => x !== id);
        await savePlaylist(pl);
      }
    }
    upNext = upNext.filter((x) => x !== id);
    const before = ctx.order.slice(0, ctxIndex + 1).filter((x) => x === id).length;
    ctx.base = ctx.base.filter((x) => x !== id);
    ctx.order = ctx.order.filter((x) => x !== id);
    ctxIndex -= before;
    if (id === currentId) stop();
    invalidate();
    if (!viewIds(view).length && (view.startsWith("album:") || view.startsWith("artist:"))) showView(view.startsWith("album:") ? "albums" : "artists");
    else renderView();
    renderQueue();
  }
  async function clearLibrary() {
    if (!confirm("Remove all " + plural(tracks.length, "song") + " from Trackly? Your playlists are kept but emptied, and your original files aren't touched.")) return;
    await tx("tracks", "readwrite", (s) => s.clear());
    for (const pl of playlists) { pl.trackIds = []; await savePlaylist(pl); }
    stop();
    tracks = [];
    trackMap = new Map();
    for (const id of [...artUrls.keys()]) dropArtUrl(id);
    upNext = [];
    invalidate();
    showView("songs");
  }

  // ── Sidebar ──
  function openSidebar() { if (innerWidth <= 700) $("app").classList.add("side-open"); }
  function closeSidebar() { $("app").classList.remove("side-open"); }
  $("sideToggle").onclick = () => $("app").classList.toggle("side-open");
  $("scrim").onclick = closeSidebar;

  let dragTrackId = null;
  function renderSidebar() {
    const a = agg();
    $("songCount").textContent = tracks.length || "";
    $("albumCount").textContent = a.albums.length || "";
    $("artistCount").textContent = a.artists.length || "";
    $$(".nav-item[data-view]").forEach((b) => {
      const v = b.dataset.view;
      b.classList.toggle("active", view === v || (v === "albums" && view.startsWith("album:")) || (v === "artists" && view.startsWith("artist:")));
    });
    const nav = $("playlistNav");
    if (nav.querySelector(".name-input")) return;   // don't interrupt naming a playlist
    nav.innerHTML = "";
    if (!playlists.length) nav.innerHTML = '<div class="side-empty">Make a playlist with +, then add songs to it.</div>';
    const playing = currentId && !audio.paused;
    for (const pl of playlists) {
      const v = "pl:" + pl.id;
      const b = document.createElement("button");
      b.className = "nav-item" + (view === v ? " active" : "") + (ctx.source === v && currentId ? " playing-src" : "");
      b.innerHTML = `<i class="fas ${ctx.source === v && playing ? "fa-volume-high" : "fa-list"}"></i><span class="nav-name"></span><span class="nav-count">${viewIds(v).length || ""}</span>`;
      b.querySelector(".nav-name").textContent = pl.name;
      b.title = pl.name;
      b.onclick = () => showView(v);
      b.ondblclick = () => renamePlaylist(pl.id, b);
      b.oncontextmenu = (e) => { e.preventDefault(); playlistMenu(pl.id, e.clientX, e.clientY); };
      b.addEventListener("dragover", (e) => {
        if (!dragTrackId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        b.classList.add("drop-ok");
      });
      b.addEventListener("dragleave", () => b.classList.remove("drop-ok"));
      b.addEventListener("drop", (e) => {
        if (!dragTrackId) return;
        e.preventDefault();
        b.classList.remove("drop-ok");
        addToPlaylist(pl.id, [dragTrackId]);
      });
      nav.appendChild(b);
    }
  }
  $$(".nav-item[data-view]").forEach((b) => (b.onclick = () => showView(b.dataset.view)));

  // ── Views ──
  function showView(v) {
    closeMenu();
    view = v;
    sort = undefined;
    selectedId = null;
    search = "";
    $("search").value = "";
    $("searchBox").classList.remove("has");
    $("content").scrollTop = 0;
    closeSidebar();
    renderView();
    saveSettings();
  }

  const playIcon = '<i class="fas fa-play"></i>';
  function emptyState(icon, title, sub, button) {
    return `<div class="empty"><div class="tile"><i class="fas ${icon}"></i></div><div class="empty-title">${esc(title)}</div>
      <div class="empty-sub">${esc(sub)}</div>${button || ""}</div>`;
  }
  const addMusicButton = '<button class="btn primary" data-hero="add"><i class="fas fa-plus"></i> Add music</button>';
  function heroActions(extra) {
    return `<div class="hero-actions">
      <button class="btn primary pill" data-hero="play"><i class="fas fa-play"></i><span class="lbl">Play</span></button>
      <button class="btn pill" data-hero="shuffle"><i class="fas fa-shuffle"></i><span class="lbl">Shuffle</span></button>${extra || ""}</div>`;
  }
  function songsMeta(ids) {
    const total = ids.reduce((s, id) => s + (trackMap.get(id).duration || 0), 0);
    return ids.length ? plural(ids.length, "song") + " · " + fmtTotal(total) : "No songs";
  }

  function tableHtml(ids, numbering) {
    const s = effectiveSort();
    const head = (key, label, cls) => {
      const on = s && s.key === key;
      return `<span class="${cls}"><button data-sort="${key}" class="${on ? "sorted" : ""}">${label}${on ? ` <i class="fas fa-caret-${s.dir > 0 ? "up" : "down"}"></i>` : ""}</button></span>`;
    };
    let h = `<div class="thead"><span class="h-num">#</span>${head("title", "Title", "h-title")}${head("artist", "Artist", "h-artist")}${head("album", "Album", "h-album")}<span class="h-dur">${head("dur", '<i class="far fa-clock"></i>', "")}</span><span></span></div>`;
    h += ids.map((id, i) => {
      const t = trackMap.get(id);
      const num = numbering === "track" && t.trackNo ? t.trackNo : i + 1;
      return `<div class="row${id === currentId ? " current" : ""}${id === selectedId ? " sel" : ""}" data-id="${id}" draggable="true">
        <div class="c-num"><span class="num">${num}</span><span class="bars"><span></span><span></span><span></span></span><button class="rplay" tabindex="-1" title="Play">${id === currentId && !audio.paused ? '<i class="fas fa-pause"></i>' : playIcon}</button></div>
        <div class="c-title"><div class="thumb">${artHtml(t)}</div><div class="t-text"><div class="r-title">${esc(tTitle(t))}</div><div class="r-sub">${esc(tArtist(t))}</div></div></div>
        <div class="c-artist"><span data-go="artist">${esc(tArtist(t))}</span></div>
        <div class="c-album"><span data-go="album">${esc(tAlbum(t))}</span></div>
        <div class="c-dur">${fmt(t.duration)}</div>
        <div><button class="icon-btn c-more" title="More"><i class="fas fa-ellipsis"></i></button></div>
      </div>`;
    }).join("");
    return h;
  }
  function cardHtml(c, i) {
    const art = c.art ? artHtml(c.art) : artHtml(null, c.kind === "album" ? c.key : c.name, c.kind === "album" ? "fa-compact-disc" : "fa-microphone-lines");
    const sub = c.kind === "album"
      ? c.artist + (c.year ? " · " + c.year : "")
      : plural(c.ids.length, "song");
    return `<div class="card ${c.kind}" data-i="${i}" title="${esc(c.name)}">
      <div class="cover">${art}<button class="cplay" title="Play">${playIcon}</button></div>
      <div class="k-name">${esc(c.name)}</div><div class="k-sub">${esc(sub)}</div></div>`;
  }
  function mosaicHtml(ids, key) {
    const arts = [], seen = new Set();
    for (const id of ids) {
      const t = trackMap.get(id);
      if (t && t.art && !seen.has(albumKey(t))) { seen.add(albumKey(t)); arts.push(t); }
      if (arts.length === 4) break;
    }
    if (arts.length === 4) return `<div class="mosaic">${arts.map((t) => `<img src="${artUrl(t)}" alt="" draggable="false">`).join("")}</div>`;
    if (arts.length) return artHtml(arts[0]);
    return artHtml(null, key, "fa-list");
  }

  function renderView() {
    const el = $("view");
    renderSidebar();
    cards = [];
    visibleIds = [];
    if (view.startsWith("pl:") && !playlistById(view.slice(3))) view = "songs";
    if (view.startsWith("album:") || view.startsWith("artist:")) {
      if (!viewIds(view).length) view = view.startsWith("album:") ? "albums" : "artists";
    }

    if (!tracks.length && !view.startsWith("pl:")) {
      el.innerHTML = `<div class="hero simple"><div class="hero-text"><h1>${esc(viewName(view))}</h1></div></div>` +
        emptyState("fa-headphones", "Your library is empty", "Add MP3, M4A, WAV, OGG or FLAC files, or drop them anywhere in Trackly. They're stored in this browser only and never uploaded.", addMusicButton);
      return;
    }

    if (view === "albums" || view === "artists") {
      const all = view === "albums" ? agg().albums : agg().artists;
      cards = all.filter((c) => matches(c.name + " " + (c.artist || "")));
      el.innerHTML = `<div class="hero simple"><div class="hero-text"><h1>${view === "albums" ? "Albums" : "Artists"}</h1>
        <div class="meta">${plural(all.length, view === "albums" ? "album" : "artist")}</div></div></div>` +
        (cards.length ? `<div class="grid">${cards.map(cardHtml).join("")}</div>`
          : emptyState("fa-magnifying-glass", "No results", `Nothing matches "${search}".`));
      return;
    }

    const base = viewIds(view);
    const filtered = base.filter((id) => matches(songText(trackMap.get(id))));
    visibleIds = sortIds(filtered, effectiveSort());
    let hero = "", numbering = "row", extra = "";

    if (view === "songs" || view === "recent") {
      extra = view === "songs" ? '<button class="icon-btn" data-hero="more" title="More"><i class="fas fa-ellipsis"></i></button>' : "";
      hero = `<div class="hero simple"><div class="hero-text"><h1>${esc(viewName(view))}</h1><div class="meta">${songsMeta(base)}</div></div>${heroActions(extra)}</div>`;
    } else if (view.startsWith("pl:")) {
      const pl = playlistById(view.slice(3));
      extra = '<button class="icon-btn" data-hero="more" title="More"><i class="fas fa-ellipsis"></i></button>';
      hero = `<div class="hero"><div class="hero-art">${mosaicHtml(base, pl.name)}</div><div class="hero-text">
        <div class="kicker">Playlist</div><h1 title="Double-click to rename">${esc(pl.name)}</h1><div class="meta">${songsMeta(base)}</div>
        ${base.length ? heroActions(extra) : `<div class="hero-actions">${extra}</div>`}</div></div>`;
    } else if (view.startsWith("album:")) {
      const a = agg().albumMap.get(view.slice(6));
      numbering = "track";
      hero = `<div class="hero"><div class="hero-art">${a.art ? artHtml(a.art) : artHtml(null, a.key, "fa-compact-disc")}</div><div class="hero-text">
        <div class="kicker">Album</div><h1>${esc(a.name)}</h1>
        <div class="meta"><span class="link" data-hero="artist">${esc(a.artist)}</span>${a.year ? " · " + a.year : ""} · ${songsMeta(base)}</div>
        ${heroActions()}</div></div>`;
    } else if (view.startsWith("artist:")) {
      const r = agg().artistMap.get(view.slice(7));
      cards = [...r.albums].map((k) => agg().albumMap.get(k)).filter(Boolean)
        .sort((x, y) => (y.year || 0) - (x.year || 0) || cmp(x.name, y.name));
      hero = `<div class="hero"><div class="hero-art round">${r.art ? artHtml(r.art) : artHtml(null, r.name, "fa-microphone-lines")}</div><div class="hero-text">
        <div class="kicker">Artist</div><h1>${esc(r.name)}</h1>
        <div class="meta">${plural(cards.length, "album")} · ${songsMeta(base)}</div>${heroActions()}</div></div>`;
      if (!search) hero += `<div class="section-title">Albums</div><div class="grid">${cards.map(cardHtml).join("")}</div><div class="section-title gap">Songs</div>`;
    }

    let body;
    if (visibleIds.length) body = tableHtml(visibleIds, numbering);
    else if (search) body = emptyState("fa-magnifying-glass", "No results", `Nothing here matches "${search}".`);
    else if (view.startsWith("pl:")) {
      body = emptyState("fa-list", "This playlist is empty",
        "Right-click any song and choose a playlist, or drag songs onto it in the sidebar. Files you drop here go straight in.",
        '<button class="btn primary" data-hero="songs"><i class="fas fa-music"></i> Browse songs</button>');
    } else body = "";
    el.innerHTML = hero + body;
  }

  // Clicks in the main view
  const viewEl = $("view");
  const coarse = matchMedia("(pointer: coarse)").matches;
  viewEl.addEventListener("click", (e) => {
    const t = e.target;
    const sortBtn = t.closest("[data-sort]");
    if (sortBtn) {
      const k = sortBtn.dataset.sort, cur = effectiveSort();
      if (cur && cur.key === k && cur.dir === 1) sort = { key: k, dir: -1 };
      else if (cur && cur.key === k) sort = defaultSort(view) ? { key: k, dir: 1 } : null;
      else sort = { key: k, dir: 1 };
      return renderView();
    }
    const heroBtn = t.closest("[data-hero]");
    if (heroBtn) return heroAction(heroBtn.dataset.hero, heroBtn);
    const card = t.closest(".card");
    if (card) {
      const c = cards[+card.dataset.i];
      if (!c) return;
      if (t.closest(".cplay")) return playFrom(viewIds(c.kind + ":" + c.key), null, c.kind + ":" + c.key);
      return showView(c.kind + ":" + c.key);
    }
    const row = t.closest(".row");
    if (!row) return;
    const id = row.dataset.id;
    if (t.closest(".c-more")) return trackMenu(id, 0, 0, t.closest(".c-more"));
    if (t.closest(".rplay") || coarse) return id === currentId ? togglePlay() : playFrom(visibleIds, id, view);
    const go = t.closest("[data-go]");
    if (go) {
      const tr = trackMap.get(id);
      return showView(go.dataset.go === "artist" ? "artist:" + artistKey(tr) : "album:" + albumKey(tr));
    }
    select(id);
  });
  viewEl.addEventListener("dblclick", (e) => {
    if (e.target.closest(".hero h1") && view.startsWith("pl:")) return renamePlaylist(view.slice(3));
    const row = e.target.closest(".row");
    if (row && !e.target.closest("button, [data-go]")) playFrom(visibleIds, row.dataset.id, view);
  });
  viewEl.addEventListener("contextmenu", (e) => {
    const row = e.target.closest(".row");
    if (row) {
      e.preventDefault();
      select(row.dataset.id);
      return trackMenu(row.dataset.id, e.clientX, e.clientY);
    }
    const card = e.target.closest(".card");
    if (card) {
      e.preventDefault();
      const c = cards[+card.dataset.i], v = c.kind + ":" + c.key;
      openMenu([
        { icon: "fa-play", label: "Play", fn: () => playFrom(viewIds(v), null, v, false) },
        { icon: "fa-shuffle", label: "Shuffle", fn: () => playFrom(viewIds(v), null, v, true) },
        { icon: "fa-arrow-turn-up fa-rotate-90", label: "Play Next", fn: () => queueSongs(viewIds(v), true) },
        { icon: "fa-list-ul", label: "Add to Queue", fn: () => queueSongs(viewIds(v), false) },
        "sep",
        { heading: "Add to playlist" },
        ...playlists.map((pl) => ({ icon: "fa-list", label: pl.name, fn: () => addToPlaylist(pl.id, viewIds(v)) })),
        { icon: "fa-plus", label: "New playlist…", fn: () => startNewPlaylist(viewIds(v)) },
      ], e.clientX, e.clientY);
    }
  });
  function select(id) {
    selectedId = id;
    viewEl.querySelectorAll(".row.sel").forEach((r) => r.classList.remove("sel"));
    const row = viewEl.querySelector(`.row[data-id="${id}"]`);
    if (row) row.classList.add("sel");
  }
  function heroAction(act, btn) {
    if (act === "play") return visibleIds.length && playFrom(visibleIds, null, view, false);
    if (act === "shuffle") return visibleIds.length && playFrom(visibleIds, null, view, true);
    if (act === "add") return $("fileInput").click();
    if (act === "songs") return showView("songs");
    if (act === "artist") {
      const a = agg().albumMap.get(view.slice(6));
      const r = a && agg().artistMap.get(a.artist.toLowerCase());
      return r ? showView("artist:" + r.key) : toast("Songs on this album are by several artists");
    }
    if (act === "more") {
      if (view.startsWith("pl:")) return playlistMenu(view.slice(3), 0, 0, btn);
      return openMenu([
        { icon: "fa-plus", label: "Add Music…", fn: () => $("fileInput").click() },
        { icon: "fa-list-ul", label: "Add All to Queue", fn: () => queueSongs(visibleIds, false) },
        "sep",
        { icon: "fa-trash-can", label: "Remove All Songs…", danger: true, fn: clearLibrary },
      ], 0, 0, btn);
    }
  }

  // Dragging songs: onto a playlist in the sidebar, or to reorder a playlist
  const canReorder = () => view.startsWith("pl:") && effectiveSort() === null && !search;
  const dropAfter = (e, el) => e.clientY > el.getBoundingClientRect().top + el.offsetHeight / 2;
  function clearDropMarks() {
    $$(".drop-before, .drop-after, .drop-ok").forEach((el) => el.classList.remove("drop-before", "drop-after", "drop-ok"));
  }
  viewEl.addEventListener("dragstart", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    dragTrackId = row.dataset.id;
    closeMenu();
    e.dataTransfer.effectAllowed = "copyMove";
    e.dataTransfer.setData("text/plain", tTitle(trackMap.get(dragTrackId)));
    setTimeout(() => row.classList.add("dragging"), 0);
    if (innerWidth <= 700) openSidebar();
  });
  viewEl.addEventListener("dragend", (e) => {
    dragTrackId = null;
    e.target.closest(".row")?.classList.remove("dragging");
    clearDropMarks();
  });
  viewEl.addEventListener("dragover", (e) => {
    const row = e.target.closest(".row");
    if (!row || !dragTrackId || !canReorder() || row.dataset.id === dragTrackId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const after = dropAfter(e, row);
    row.classList.toggle("drop-after", after);
    row.classList.toggle("drop-before", !after);
  });
  viewEl.addEventListener("dragleave", (e) => e.target.closest(".row")?.classList.remove("drop-before", "drop-after"));
  viewEl.addEventListener("drop", (e) => {
    const row = e.target.closest(".row");
    if (!row || !dragTrackId || !canReorder()) return;
    e.preventDefault();
    e.stopPropagation();
    const moving = dragTrackId;
    clearDropMarks();
    reorderPlaylist(view.slice(3), moving, row.dataset.id, dropAfter(e, row));
  });

  // Search
  let searchTimer;
  $("search").addEventListener("input", () => {
    $("searchBox").classList.toggle("has", !!$("search").value);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { search = $("search").value.trim(); renderView(); }, 120);
  });
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.stopPropagation(); clearSearch(); $("search").blur(); }
    if (e.key === "Enter" && visibleIds.length) { e.preventDefault(); playFrom(visibleIds, visibleIds[0], view); }
  });
  function clearSearch() {
    $("search").value = "";
    $("searchBox").classList.remove("has");
    search = "";
    renderView();
  }
  $("searchClear").onclick = () => { clearSearch(); $("search").focus(); };

  // ── Up Next ──
  function qItem(t, kind, idx) {
    if (!t) return "";
    return `<div class="q-item${kind === "now" ? " now" : ""}" data-kind="${kind}" data-idx="${idx}" data-id="${t.id}"${kind === "now" ? "" : ' draggable="true"'}>
      <div class="thumb">${artHtml(t)}</div>
      <div class="t-text"><div class="r-title">${esc(tTitle(t))}</div><div class="r-sub">${esc(tArtist(t))}</div></div>
      <span class="q-dur">${fmt(t.duration)}</span>
      ${kind === "now" ? "" : '<button class="icon-btn q-x" title="Remove"><i class="fas fa-xmark"></i></button>'}</div>`;
  }
  function queueHtml() {
    const cur = trackMap.get(currentId);
    let h = '<div class="q-label"><span>Now Playing</span></div>';
    h += cur ? qItem(cur, "now", 0) : '<div class="q-empty">Nothing playing. Double-click a song to start.</div>';
    h += `<div class="q-label"><span>Next in Queue</span>${upNext.length ? '<button data-q="clear">Clear</button>' : ""}</div>`;
    h += upNext.length ? upNext.map((id, i) => qItem(trackMap.get(id), "u", i)).join("")
      : '<div class="q-empty">Right-click a song and choose Play Next or Add to Queue.</div>';
    if (ctx.order.length) {
      const rest = ctx.order.slice(ctxIndex + 1, ctxIndex + 201);
      h += `<div class="q-label"><span>Next from: ${esc(viewName(ctx.source))}</span></div>`;
      h += rest.length ? rest.map((id, k) => qItem(trackMap.get(id), "c", ctxIndex + 1 + k)).join("")
        : `<div class="q-empty">${repeat === "all" ? "Repeat is on, so it starts again from the top." : "That's the end of the list."}</div>`;
    }
    return h;
  }
  const queueOpen = () => $("queue").classList.contains("open");
  const fpQueueOpen = () => $("fp").classList.contains("open") && $("fp").classList.contains("show-queue");
  function renderQueue() {
    if (queueOpen()) $("queueBody").innerHTML = queueHtml();
    if (fpQueueOpen()) $("fpQueueBody").innerHTML = queueHtml();
  }
  function toggleQueue() {
    if ($("fp").classList.contains("open")) {
      $("fp").classList.toggle("show-queue");
    } else {
      $("queue").classList.toggle("open");
    }
    renderQueue();
    updateModes();
  }
  $("queueClose").onclick = toggleQueue;

  function queueSongs(ids, playNext) {
    ids = ids.filter((id) => trackMap.has(id));
    if (!ids.length) return;
    if (playNext) upNext.unshift(...ids); else upNext.push(...ids);
    if (!currentId) next(false);
    else toast((ids.length > 1 ? plural(ids.length, "song") : '"' + tTitle(trackMap.get(ids[0])) + '"') + (playNext ? " will play next" : " added to the queue"));
    renderQueue();
  }

  ["queueBody", "fpQueueBody"].forEach((bodyId) => {
    const body = $(bodyId);
    let dragQ = null;
    body.addEventListener("click", (e) => {
      if (e.target.closest('[data-q="clear"]')) { upNext = []; return renderQueue(); }
      const item = e.target.closest(".q-item");
      if (!item) return;
      const kind = item.dataset.kind, idx = +item.dataset.idx;
      if (e.target.closest(".q-x")) {
        if (kind === "u") upNext.splice(idx, 1);
        else if (kind === "c") ctx.order.splice(idx, 1);
        return renderQueue();
      }
      if (kind === "now") return togglePlay();
      if (kind === "u") { const [id] = upNext.splice(idx, 1); upNext.splice(0, idx); return load(id, true); }
      if (kind === "c") { ctxIndex = idx; return load(ctx.order[idx], true); }
    });
    body.addEventListener("contextmenu", (e) => {
      const item = e.target.closest(".q-item");
      if (!item) return;
      e.preventDefault();
      trackMenu(item.dataset.id, e.clientX, e.clientY);
    });
    body.addEventListener("dragstart", (e) => {
      const item = e.target.closest(".q-item");
      if (!item) return;
      dragQ = { kind: item.dataset.kind, idx: +item.dataset.idx };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
      setTimeout(() => item.classList.add("dragging"), 0);
    });
    body.addEventListener("dragend", () => { dragQ = null; renderQueue(); });
    body.addEventListener("dragover", (e) => {
      const item = e.target.closest(".q-item");
      if (!dragQ || !item || item.dataset.kind !== dragQ.kind) return;
      e.preventDefault();
      const after = dropAfter(e, item);
      body.querySelectorAll(".drop-before, .drop-after").forEach((x) => x !== item && x.classList.remove("drop-before", "drop-after"));
      item.classList.toggle("drop-after", after);
      item.classList.toggle("drop-before", !after);
    });
    body.addEventListener("drop", (e) => {
      const item = e.target.closest(".q-item");
      if (!dragQ || !item || item.dataset.kind !== dragQ.kind) return;
      e.preventDefault();
      const list = dragQ.kind === "u" ? upNext : ctx.order;
      let to = +item.dataset.idx + (dropAfter(e, item) ? 1 : 0);
      const [moved] = list.splice(dragQ.idx, 1);
      if (dragQ.idx < to) to--;
      list.splice(to, 0, moved);
      dragQ = null;
      renderQueue();
    });
  });

  // ── Playback ──
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function buildOrder(firstId) {
    if (!shuffle) return ctx.base.slice();
    const rest = shuffled(ctx.base.filter((id) => id !== firstId));
    return firstId ? [firstId, ...rest] : rest;
  }
  // Start playing a list. startId null = from the top (or a random song with shuffle).
  function playFrom(ids, startId, source, withShuffle) {
    ids = ids.filter((id) => trackMap.has(id));
    if (!ids.length) return;
    if (withShuffle !== undefined && withShuffle !== shuffle) { shuffle = withShuffle; saveSettings(); }
    ctx = { source, base: ids.slice(), order: [] };
    if (!startId) startId = shuffle ? ids[Math.floor(Math.random() * ids.length)] : ids[0];
    ctx.order = buildOrder(startId);
    ctxIndex = ctx.order.indexOf(startId);
    updateModes();
    load(startId, true);
  }

  async function load(id, autoplay, at) {
    const t = trackMap.get(id);
    if (!t) return;
    const token = ++loadToken;
    let blob = null;
    try { blob = await getBlob(id); } catch (e) {}
    if (token !== loadToken) return;
    if (!blob) return toast("That song is missing from storage");
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    currentId = id;
    pendingSeek = at || 0;
    audio.src = currentUrl;
    updateNow();
    if (autoplay) { try { await audio.play(); } catch (e) { /* autoplay blocked: press play */ } }
    updatePlayState();
    saveSettings();
  }

  function stop() {
    loadToken++;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = null;
    currentId = null;
    ctx = { source: null, base: [], order: [] };
    ctxIndex = -1;
    updateNow();
    updateTime();
    updatePlayState();
    saveSettings();
  }

  function togglePlay() {
    if (!currentId) {
      if (upNext.length) return next(false);
      const ids = visibleIds.length ? visibleIds : viewIds("songs");
      const src = visibleIds.length ? view : "songs";
      if (ids.length) playFrom(ids, null, src);
      return;
    }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }

  function next(auto) {
    if (upNext.length) return load(upNext.shift(), true);
    if (!ctx.order.length) { if (!currentId && !auto) togglePlay(); return; }
    let j = ctxIndex + 1;
    if (j >= ctx.order.length) {
      if (auto && repeat !== "all") { audio.currentTime = 0; updatePlayState(); return; }
      if (shuffle) ctx.order = buildOrder(null);
      j = 0;
    }
    ctxIndex = j;
    load(ctx.order[j], true);
  }
  function prev() {
    if (!currentId) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    const atCtx = ctx.order[ctxIndex];
    if (atCtx && atCtx !== currentId) return load(atCtx, true);   // was playing a queued song
    if (ctxIndex > 0) { ctxIndex--; return load(ctx.order[ctxIndex], true); }
    if (repeat === "all" && ctx.order.length > 1) { ctxIndex = ctx.order.length - 1; return load(ctx.order[ctxIndex], true); }
    audio.currentTime = 0;
  }
  function setShuffle(on) {
    shuffle = on;
    if (ctx.base.length) {
      const cur = ctx.order[ctxIndex];
      ctx.order = on ? buildOrder(cur || null) : ctx.base.slice();
      ctxIndex = cur ? ctx.order.indexOf(cur) : -1;
    }
    updateModes();
    renderQueue();
    saveSettings();
    toast(on ? "Shuffle on" : "Shuffle off", 1200);
  }
  function cycleRepeat() {
    repeat = repeat === "off" ? "all" : repeat === "all" ? "one" : "off";
    updateModes();
    renderQueue();
    saveSettings();
    toast({ off: "Repeat off", all: "Repeating the list", one: "Repeating this song" }[repeat], 1200);
  }

  audio.addEventListener("ended", () => {
    if (repeat === "one") { audio.currentTime = 0; audio.play().catch(() => {}); }
    else next(true);
  });
  audio.addEventListener("play", updatePlayState);
  audio.addEventListener("pause", () => { updatePlayState(); saveSettings(); });
  audio.addEventListener("loadedmetadata", () => {
    if (pendingSeek && pendingSeek < audio.duration - 1) audio.currentTime = pendingSeek;
    pendingSeek = 0;
    updateTime();
  });
  let lastSave = 0, lastPos = 0;
  audio.addEventListener("timeupdate", () => {
    updateTime();
    const now = Date.now();
    if (now - lastSave > 5000) { lastSave = now; saveSettings(); }
    if (now - lastPos > 1000 && "mediaSession" in navigator && audio.duration) {
      lastPos = now;
      try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) }); } catch (e) {}
    }
  });

  // ── Now playing (bar + full-screen player) ──
  function updateNow() {
    const t = trackMap.get(currentId);
    $("np").classList.toggle("empty-np", !t);
    $("npArt").innerHTML = t ? artHtml(t) : artHtml(null, "trackly", "fa-headphones");
    $("npTitle").textContent = t ? tTitle(t) : "Nothing playing";
    $("npArtist").textContent = t ? tArtist(t) : "Pick a song to start";
    $("fpArt").innerHTML = t ? artHtml(t) : artHtml(null, "trackly", "fa-headphones");
    $("fpTitle").textContent = t ? tTitle(t) : "Nothing playing";
    $("fpArtist").innerHTML = t
      ? `<span class="link" data-fp="artist">${esc(tArtist(t))}</span>${t.album ? ' — <span class="link" data-fp="album">' + esc(t.album) + "</span>" : ""}`
      : "Pick a song in your library";
    const u = artUrl(t);
    $("fpBg").innerHTML = u ? `<img src="${u}" alt="">` : "";
    $("fpBg").style.background = u ? "" : gradient(t ? placeholderKey(t) : "trackly");
    $("fpSource").textContent = t ? viewName(ctx.source) : "Trackly";
    document.title = t ? tTitle(t) + " · " + tArtist(t) : "Trackly";
    setMediaSession(t);
    markPlaying();
    renderQueue();
    broadcastNow();
  }
  $("fpArtist").addEventListener("click", (e) => {
    const go = e.target.closest("[data-fp]");
    const t = trackMap.get(currentId);
    if (!go || !t) return;
    closeFull();
    showView(go.dataset.fp === "artist" ? "artist:" + artistKey(t) : "album:" + albumKey(t));
  });

  function markPlaying() {
    viewEl.querySelectorAll(".row.current").forEach((r) => r.classList.remove("current"));
    if (currentId) viewEl.querySelectorAll(`.row[data-id="${currentId}"]`).forEach((r) => r.classList.add("current"));
    renderSidebar();
  }
  function updatePlayState() {
    const playing = !!currentId && !audio.paused;
    document.body.classList.toggle("is-playing", playing);
    $("fp").classList.toggle("playing", playing);
    $$('[data-act="play"]').forEach((b) => {
      b.innerHTML = `<i class="fas fa-${playing ? "pause" : "play"}"></i>`;
      b.title = (playing ? "Pause" : "Play") + " (Space)";
    });
    viewEl.querySelectorAll(".row .rplay").forEach((b) => {
      const mine = b.closest(".row").dataset.id === currentId;
      b.innerHTML = `<i class="fas fa-${mine && playing ? "pause" : "play"}"></i>`;
    });
    const canPlay = !!currentId || tracks.length > 0;
    $$('[data-act="play"], [data-act="next"], [data-act="prev"]').forEach((b) => (b.disabled = !canPlay));
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = currentId ? (playing ? "playing" : "paused") : "none";
    renderSidebar();
  }
  function updateTime() {
    const dur = currentId && isFinite(audio.duration) ? audio.duration : 0;
    const cur = currentId ? audio.currentTime : 0;
    if (!seeking) {
      $$(".seek").forEach((s) => { s.value = dur ? (cur / dur) * 1000 : 0; setRangeFill(s); });
      $$('[data-time="cur"]').forEach((el) => (el.textContent = fmt(cur)));
    }
    $$('[data-time="rem"]').forEach((el) => (el.textContent = dur ? "-" + fmt(dur - cur) : "0:00"));
    $("barProgress").style.width = dur ? (cur / dur) * 100 + "%" : "0";
  }
  function updateModes() {
    $$('[data-act="shuffle"]').forEach((b) => { b.classList.toggle("on", shuffle); b.title = (shuffle ? "Shuffle on" : "Shuffle") + " (S)"; });
    $$('[data-act="repeat"]').forEach((b) => {
      b.classList.toggle("on", repeat !== "off");
      b.classList.toggle("one", repeat === "one");
      b.title = { off: "Repeat", all: "Repeat all", one: "Repeat one" }[repeat] + " (R)";
    });
    const qOn = $("fp").classList.contains("open") ? $("fp").classList.contains("show-queue") : queueOpen();
    $$('[data-act="queue"]').forEach((b) => b.classList.toggle("on", qOn));
    broadcastNow();
  }

  // Seek and volume sliders (the bar and the full-screen player each have a set)
  $$(".seek").forEach((s) => {
    s.addEventListener("input", () => {
      seeking = true;
      setRangeFill(s);
      if (audio.duration) {
        const t = (s.value / 1000) * audio.duration;
        $$('[data-time="cur"]').forEach((el) => (el.textContent = fmt(t)));
      }
    });
    s.addEventListener("change", () => {
      if (currentId && audio.duration) audio.currentTime = (s.value / 1000) * audio.duration;
      seeking = false;
      updateTime();
    });
  });
  function setVolume(v) {
    volume = Math.max(0, Math.min(100, Math.round(v)));
    audio.volume = volume / 100;
    $$(".vol").forEach((el) => { el.value = volume; setRangeFill(el); });
    const icon = volume === 0 ? "volume-xmark" : volume < 50 ? "volume-low" : "volume-high";
    $$('[data-act="mute"]').forEach((b) => { b.innerHTML = `<i class="fas fa-${icon}"></i>`; b.title = (volume === 0 ? "Unmute" : "Mute") + " (M)"; });
    saveSettings();
  }
  $$(".vol").forEach((el) => el.addEventListener("input", () => setVolume(+el.value)));
  function toggleMute() {
    if (volume > 0) { lastVolume = volume; setVolume(0); } else setVolume(lastVolume || 80);
  }

  // Every shared control is a [data-act] button
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === "play") togglePlay();
    else if (act === "next") next(false);
    else if (act === "prev") prev();
    else if (act === "shuffle") setShuffle(!shuffle);
    else if (act === "repeat") cycleRepeat();
    else if (act === "mute") toggleMute();
    else if (act === "queue") toggleQueue();
    else if (act === "full") openFull();
  });
  $("np").addEventListener("click", () => currentId && openFull());

  // ── Full-screen player ──
  const fpEl = $("fp");
  function openFull() {
    if (!currentId && tracks.length) togglePlay();
    $("queue").classList.remove("open");
    fpEl.classList.add("open");
    fpEl.setAttribute("aria-hidden", "false");
    if (innerWidth > 1000) fpEl.classList.add("show-queue");
    renderQueue();
    updateModes();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  }
  function closeFull() {
    fpEl.classList.remove("open", "show-queue");
    fpEl.setAttribute("aria-hidden", "true");
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    updateModes();
  }
  const isFull = () => fpEl.classList.contains("open");
  $("fpClose").onclick = closeFull;
  // Optionally fill the whole screen too (only when the page is allowed to)
  if (!document.fullscreenEnabled) $("fpWinFs").style.display = "none";
  $("fpWinFs").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => toast("Full screen isn't allowed here"));
  };
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    $("fpWinFs").innerHTML = `<i class="fas fa-${on ? "compress" : "expand"}"></i>`;
    $("fpWinFs").title = on ? "Exit full screen" : "Fill the screen";
  });

  // ── Keyboard ──
  document.addEventListener("keydown", (e) => {
    const el = e.target;
    const typing = (el.tagName === "INPUT" && el.type !== "range") || el.tagName === "TEXTAREA" || el.isContentEditable;
    if (e.key === "Escape") {
      if (menuEl) return closeMenu();
      if (isFull()) return closeFull();
      if (queueOpen()) return toggleQueue();
      if ($("app").classList.contains("side-open")) return closeSidebar();
      return;
    }
    if (typing) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); closeFull(); $("search").focus(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    let handled = true;
    if (e.code === "Space") togglePlay();
    else if (e.key === "ArrowRight" && e.shiftKey) next(false);
    else if (e.key === "ArrowLeft" && e.shiftKey) prev();
    else if (e.key === "ArrowRight") { if (currentId) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
    else if (e.key === "ArrowLeft") { if (currentId) audio.currentTime = Math.max(0, audio.currentTime - 5); }
    else if (e.key === "ArrowUp") setVolume(volume + 5);
    else if (e.key === "ArrowDown") setVolume(volume - 5);
    else if (k === "n") next(false);
    else if (k === "p") prev();
    else if (k === "f") isFull() ? closeFull() : openFull();
    else if (k === "m") toggleMute();
    else if (k === "s") setShuffle(!shuffle);
    else if (k === "r") cycleRepeat();
    else if (k === "q") toggleQueue();
    else if (k === "/") { closeFull(); $("search").focus(); }
    else if (e.key === "Enter" && selectedId && visibleIds.includes(selectedId)) playFrom(visibleIds, selectedId, view);
    else handled = false;
    if (handled) e.preventDefault();
  });

  // ── Media keys, lock screen and system media controls ──
  function setMediaSession(t) {
    if (!("mediaSession" in navigator)) return;
    try {
      if (!t) { navigator.mediaSession.metadata = null; return; }
      const u = artUrl(t);
      navigator.mediaSession.metadata = new MediaMetadata({
        title: tTitle(t),
        artist: tArtist(t),
        album: t.album || viewName(ctx.source),
        artwork: u ? [{ src: u, sizes: "512x512", type: t.art.type || "image/jpeg" }] : [],
      });
    } catch (e) {}
  }
  if ("mediaSession" in navigator) {
    const handlers = {
      play: () => togglePlay(),
      pause: () => audio.pause(),
      stop: () => audio.pause(),
      previoustrack: prev,
      nexttrack: () => next(false),
      seekbackward: (d) => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); },
      seekforward: (d) => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); },
      seekto: (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; },
    };
    for (const [name, fn] of Object.entries(handlers)) {
      try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) { /* not supported here */ }
    }
  }

  // ── Desktop menu bar: tell X-ORBIT what's playing and take its controls ──
  // Messages: { type: "xorbit-now-playing", app, state } out, { type: "xorbit-media-control", action, value } in.
  function broadcastNow() {
    if (!inDesktop || nowTimer) return;
    // Several updates usually land together (new song = now + play state + time); send once
    nowTimer = setTimeout(() => {
      nowTimer = null;
      const t = trackMap.get(currentId);
      const state = t ? {
        title: tTitle(t),
        artist: tArtist(t),
        album: t.album || "",
        art: artUrl(t),
        artBg: artUrl(t) ? "" : gradient(placeholderKey(t)),
        playing: !audio.paused,
        position: audio.currentTime || 0,
        duration: isFinite(audio.duration) ? audio.duration : 0,
        shuffle,
        repeat,
      } : null;
      try { parent.postMessage({ type: "xorbit-now-playing", app: "Trackly", state }, location.origin); } catch (e) {}
    }, 50);
  }
  if (inDesktop) {
    window.addEventListener("message", (e) => {
      if (e.source !== parent || e.origin !== location.origin) return;
      const d = e.data;
      if (!d || d.type !== "xorbit-media-control") return;
      switch (d.action) {
        case "toggle": togglePlay(); break;
        case "next": next(false); break;
        case "prev": prev(); break;
        case "shuffle": setShuffle(!shuffle); break;
        case "repeat": cycleRepeat(); break;
        case "seek":
          if (currentId && audio.duration && isFinite(d.value)) audio.currentTime = Math.max(0, Math.min(audio.duration, d.value));
          break;
        case "hello": break;   // the desktop asking for the current state
      }
      broadcastNow();
    });
    ["play", "pause", "loadedmetadata", "seeked", "emptied"].forEach((ev) => audio.addEventListener(ev, broadcastNow));
    let lastNowSend = 0;
    audio.addEventListener("timeupdate", () => {
      const now = Date.now();
      if (now - lastNowSend > 2000) { lastNowSend = now; broadcastNow(); }
    });
    window.addEventListener("pagehide", () => {
      try { parent.postMessage({ type: "xorbit-now-playing", app: "Trackly", state: null }, location.origin); } catch (e) {}
    });
  }

  // ── Theme: follow the desktop's light/dark mode when running inside it ──
  function syncTheme() {
    let light;
    try {
      light = parent !== window && parent.document.body.classList.contains("light-mode");
    } catch (e) { light = undefined; }
    if (light === undefined || parent === window) light = matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.classList.toggle("light", light);
  }
  syncTheme();
  try {
    if (parent !== window) new MutationObserver(syncTheme).observe(parent.document.body, { attributes: true, attributeFilter: ["class"] });
  } catch (e) {}
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", syncTheme);

  // ── Settings (remembered per browser) ──
  let ready = false;   // nothing is saved until the library has loaded, so startup can't overwrite it
  function saveSettings() {
    if (!ready) return;
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        volume, shuffle, repeat, view,
        last: currentId ? { id: currentId, time: pendingSeek || audio.currentTime || 0, source: ctx.source } : null,
      }));
    } catch (e) {}
  }
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {}; } catch (e) {}
  if (typeof saved.volume === "number") volume = saved.volume;
  shuffle = !!saved.shuffle;
  if (["off", "all", "one"].includes(saved.repeat)) repeat = saved.repeat;
  window.addEventListener("pagehide", saveSettings);

  // Old records have no tags yet: read them once in the background and save them
  async function scanTags() {
    const todo = tracks.filter((t) => !t.tagged);
    let changed = 0;
    for (const t of todo) {
      if (!trackMap.has(t.id)) continue;
      let rec;
      try { rec = await getRecord(t.id); } catch (e) { continue; }
      if (!rec || !rec.blob) continue;
      let tags = null;
      try { tags = await readTags(rec.blob); } catch (e) {}
      const info = describe(tags, rec.name, false);
      try { await tx("tracks", "readwrite", (s) => s.put({ ...rec, ...info })); } catch (e) { break; }
      Object.assign(t, info);
      dropArtUrl(t.id);
      changed++;
      if (changed % 20 === 0) { invalidate(); renderView(); }
    }
    if (changed) {
      invalidate();
      renderView();
      if (todo.some((t) => t.id === currentId)) updateNow();
    }
  }

  // ── Start ──
  setVolume(volume);
  updateModes();
  updateNow();
  updateTime();
  updatePlayState();
  renderView();
  Promise.all([
    loadAll("tracks", ({ blob, ...meta }) => meta),
    loadAll("playlists", (p) => p),
  ])
    .then(([t, p]) => {
      tracks = t.sort((a, b) => (a.added || 0) - (b.added || 0));
      for (const tr of tracks) {
        if (!tr.title) {   // not read yet: show the file name split into artist and title for now
          const f = fromName(tr.name, false);
          tr.title = f.title;
          if (!tr.artist) tr.artist = f.artist;
        }
      }
      trackMap = new Map(tracks.map((tr) => [tr.id, tr]));
      playlists = p.sort((a, b) => a.created - b.created);
      invalidate();

      // Views saved by the first version were "library" or a bare playlist id
      let v = typeof saved.view === "string" ? saved.view : "songs";
      if (v === "library") v = "songs";
      else if (playlistById(v)) v = "pl:" + v;
      view = v;
      ready = true;
      renderView();

      // Pick up where the last session left off (paused)
      const last = saved.last;
      if (last && trackMap.has(last.id)) {
        let src = typeof last.source === "string" ? last.source : "songs";
        let ids = viewIds(src);
        if (src === "songs") ids = sortIds(ids, defaultSort("songs"));
        if (!ids.includes(last.id)) { src = "songs"; ids = sortIds(viewIds("songs"), defaultSort("songs")); }
        ctx = { source: src, base: ids, order: [] };
        ctx.order = buildOrder(last.id);
        ctxIndex = ctx.order.indexOf(last.id);
        load(last.id, false, last.time || 0);
      }
      updatePlayState();
      scanTags();
    })
    .catch(() => toast("Storage is unavailable, so songs won't be saved"));
</script>
</body>
</html>
