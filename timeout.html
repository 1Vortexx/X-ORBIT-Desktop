<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Timeout - X-ORBIT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    height: 100vh;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    color: #fff;
}

.timeout-container {
    width: 90%;
    max-width: 520px;
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 3rem;
    text-align: center;
}

.icon-container { margin-bottom: 1.75rem; }

.timeout-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto;
    border-radius: 8px;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #f59e0b;
}

.timeout-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.5rem;
}

.timeout-message {
    color: rgba(255,255,255,0.5);
    font-size: 0.875rem;
    line-height: 1.65;
    margin-bottom: 1.25rem;
}

.timeout-message strong { color: #f59e0b; font-weight: 600; }

.plan-badge {
    display: inline-block;
    background: rgba(251,191,36,0.08);
    color: #f59e0b;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 0.875rem;
    border-radius: 4px;
    border: 1px solid rgba(251,191,36,0.2);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
}

.button-group {
    display: flex;
    gap: 0.75rem;
    flex-direction: column;
    align-items: center;
}

.restart-btn {
    width: 100%;
    max-width: 260px;
    padding: 0.625rem 1.25rem;
    border-radius: 6px;
    border: none;
    font-weight: 500;
    font-size: 0.875rem;
    color: #fff;
    background: #4f8aff;
    cursor: pointer;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: 'Inter', sans-serif;
}

.restart-btn:hover { opacity: 0.85; }

.upgrade-btn {
    width: 100%;
    max-width: 260px;
    padding: 0.625rem 1.25rem;
    border-radius: 6px;
    border: 1px solid rgba(251,191,36,0.25);
    font-weight: 500;
    font-size: 0.875rem;
    color: #f59e0b;
    background: transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: 'Inter', sans-serif;
}

.upgrade-btn:hover {
    background: rgba(251,191,36,0.08);
    border-color: rgba(251,191,36,0.4);
}

.divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 260px;
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
}

.divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
}

@media (max-width: 600px) {
    .timeout-container { width: 95%; padding: 2rem; }
    .restart-btn, .upgrade-btn { max-width: 100%; }
}
</style>
</head>
<body>
<div class="timeout-container">
    <div class="icon-container">
        <div class="timeout-icon">
            <i class="fa-solid fa-hourglass-end"></i>
        </div>
    </div>
    
    <h1 class="timeout-title">Session Timeout</h1>
    
    <div class="plan-badge">Session Limit Reached</div>
    
    <p class="timeout-message">
        Your session has expired due to <strong>1 hour of usage</strong>. This is a limit on the to ensure X-ORBIT is not being abused and to keep it updated.
    </p>
    
    <p class="timeout-message">
        You can restart your session below, or upgrade to a premium plan to extend this limit.
    </p>
    
    <div class="button-group">
        <button class="restart-btn" onclick="restartSession()">
            <i class="fa-solid fa-rotate-right"></i>
            Restart Session
        </button>
        
        <div class="divider">or</div>
        
        <button class="upgrade-btn" onclick="upgradePlan()">
            <i class="fa-solid fa-crown"></i>
            Upgrade to Premium
        </button>
    </div>
</div>

<script>
console.log('⏰ X-ORBIT Session Timeout Page Loaded');

function restartSession() {
    window.location.href = 'app.html';
}

function upgradePlan() {
    console.log('⬆️ User clicked upgrade, redirecting to upgrade page');
    // Change this URL to your actual upgrade/pricing page
    window.location.href = 'support.html';
    // Or open in new tab:
    // window.open('upgrade.html', '_blank');
}

console.log('✅ Timeout page initialized');
</script>
</body>
</html>
