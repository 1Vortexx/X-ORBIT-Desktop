<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultraviolet Browser UI</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Times New Roman", Times, serif;
}

body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* MAIN CONTAINER */
.browser {
  width: 1000px;
  height: 620px;
  background: #0b0b0f;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #1a1a22;
}

/* TOP BAR (MINIMAL TABS) */
.topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px;
  background: #0e0e13;
  border-bottom: 1px solid #1a1a22;
}

.tab {
  padding: 6px 12px;
  border-radius: 8px;
  background: #15151d;
  color: #777;
  font-size: 13px;
  transition: 0.2s;
}

.tab.active {
  background: #1c1c26;
  color: #fff;
}

.tab.add {
  background: transparent;
  color: #666;
  font-weight: bold;
}

/* NAVBAR */
.navbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  background: #0b0b0f;
  border-bottom: 1px solid #1a1a22;
}

.navbar button {
  background: #15151d;
  border: none;
  color: #aaa;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.navbar button:hover {
  background: #1c1c26;
  color: white;
}

.navbar input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 999px;
  border: none;
  outline: none;
  background: #15151d;
  color: white;
  font-size: 14px;
}

/* WEBVIEW */
.webview {
  flex: 1;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

.placeholder {
  color: #555;
  font-size: 16px;
}

/* LANDING PAGE */
.landing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
}

.logo {
  position: relative;
  width: 80px;
  height: 80px;
}

.planet {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid #fff;
  background: transparent;
}

.ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 130%;
  height: 40%;
  border-radius: 50%;
  border: 2px solid #fff;
  transform: translate(-50%, -50%) rotate(25deg);
}

.ring::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid #fff;
  transform: scale(0.75);
}

.title {
  font-size: 22px;
  font-weight: 600;
  color: #fff;
}

.subtitle {
  font-size: 14px;
  color: #777;
}

.clock {
  font-size: 32px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 1px;
}

.searchbox {
  width: 420px;
  max-width: 90%;
  padding: 12px 16px;
  border-radius: 999px;
  border: none;
  outline: none;
  background: #15151d;
  color: white;
  font-size: 14px;
}

.quick-links {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.quick-link {
  padding: 8px 14px;
  background: #15151d;
  border-radius: 8px;
  font-size: 13px;
  color: #aaa;
  cursor: pointer;
}

.quick-link:hover {
  background: #1c1c26;
  color: #fff;
}

/* BOTTOM BAR */
.bottombar {
  display: flex;
  justify-content: space-between;
  padding: 8px 14px;
  font-size: 12px;
  color: #666;
  background: #0e0e13;
  border-top: 1px solid #1a1a22;
}
</style>
</head>

<body>

<div class="browser">

  <div class="topbar">
    <div class="tab active">New Tab</div>
    <div class="tab">Tab 1</div>
    <div class="tab">Tab 2</div>
    <div class="tab add">+</div>
  </div>

  <div class="navbar">
    <button>🏠</button>
    <button>⟳</button>
    <input type="text" placeholder="Search DuckDuckGo or enter URL..." />
    <button>⋯</button>
  </div>

  <div class="webview">
    <div class="landing">
      <div class="logo">
        <div class="planet"></div>
        <div class="ring"></div>
      </div>
      <div class="title">ORBIX</div>
      <div class="subtitle">Private. Fast. Clean.</div>
      <div class="clock" id="clock">--:--</div>
      <input class="searchbox" placeholder="Search the web or enter a URL..." />

      <div class="quick-links">
        <div class="quick-link">YouTube</div>
        <div class="quick-link">DuckDuckGo</div>
        <div class="quick-link">Discord</div>
        <div class="quick-link">GitHub</div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <span>Status: Connected</span>
    <span>12:45</span>
  </div>

</div>

<script>
function updateClock() {
  const now = new Date();
  const hours = now.getHours().toString().padStart(2, '0');
  const minutes = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('clock').textContent = `${hours}:${minutes}`;
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
