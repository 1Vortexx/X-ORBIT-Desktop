<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #121212;
    --surface: #181818;
    --border: #282828;
    --text: #ffffff;
    --text2: #b3b3b3;
    --accent: #1db954;
    --red: #ff6b6b;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px 0 16px;
    height: 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    user-select: none;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .header-brand i { color: var(--accent); font-size: 1.05rem; }
  .header-note { font-size: 0.75rem; color: var(--text2); }
  .hdr-btn {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--text2);
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
  }
  .hdr-btn:hover { background: var(--border); color: var(--text); }

  /* ── Player ── */
  .stage { position: relative; flex: 1; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--bg);
    color: var(--text2);
    font-size: 0.9rem;
    text-align: center;
    padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay .fa-triangle-exclamation { color: var(--red); font-size: 1.6rem; }
  .retry {
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    padding: 8px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-brand"><i class="fab fa-spotify"></i> Spotify</div>
    <span class="header-note">via ORBIX</span>
    <button class="hdr-btn" id="reloadBtn" title="Reload"><i class="fas fa-rotate-right"></i></button>
  </div>

  <div class="stage">
    <iframe id="player" allow="encrypted-media; autoplay; clipboard-write; fullscreen"></iframe>
    <div class="overlay" id="loading">
      <div class="spin"></div>
      <p>Starting Spotify&hellip;</p>
    </div>
    <div class="overlay" id="offline" hidden>
      <i class="fas fa-triangle-exclamation"></i>
      <p>uv.xorbit.org isn't responding, so Spotify couldn't load.<br>Check your internet connection, then try again.</p>
      <button class="retry" id="retryBtn">Try again</button>
    </div>
  </div>

<script>
  const LAUNCH_URL = "https://uv.xorbit.org/launch?app=spotify";
  const player  = document.getElementById("player");
  const loading = document.getElementById("loading");
  const offline = document.getElementById("offline");

  async function proxyReachable() {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      await fetch("https://uv.xorbit.org/", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
      clearTimeout(t);
      return true;
    } catch {
      return false;
    }
  }

  async function start() {
    offline.hidden = true;
    loading.hidden = false;
    player.src = "about:blank";
    if (!(await proxyReachable())) {
      loading.hidden = true;
      offline.hidden = false;
      return;
    }
    player.src = LAUNCH_URL;
  }

  // The launcher redirects once into Spotify; hide the spinner once anything has loaded
  player.addEventListener("load", () => {
    if (player.src !== "about:blank") loading.hidden = true;
  });

  document.getElementById("reloadBtn").addEventListener("click", start);
  document.getElementById("retryBtn").addEventListener("click", start);
  start();
</script>
</body>
</html>
