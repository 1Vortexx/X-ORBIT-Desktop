<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended - X-ORBIT</title>
    <link rel="icon" href="https://codehs.com/uploads/7f204d91a682cb833441eb2fc59228b6" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
        }

        .blocked-container {
            width: 90%;
            max-width: 520px;
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
        }

        .blocked-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(239,68,68,0.3);
            background: rgba(239,68,68,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ef4444;
        }

        .blocked-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .blocked-username {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 2rem;
        }

        .blocked-reason-container {
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 6px;
            padding: 1.25rem;
            margin-bottom: 2rem;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .blocked-reason-container::-webkit-scrollbar { width: 4px; }
        .blocked-reason-container::-webkit-scrollbar-track { background: transparent; }
        .blocked-reason-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        .blocked-reason {
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            font-size: 0.875rem;
            white-space: pre-wrap;
        }

        .blocked-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .blocked-btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .blocked-btn.primary { background: #4f8aff; color: #fff; }
        .blocked-btn.primary:hover { opacity: 0.85; }

        .blocked-btn.secondary {
            background: transparent;
            color: rgba(255,255,255,0.55);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .blocked-btn.secondary:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.25);
        }

        .footer-text {
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.28);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .blocked-container { padding: 2rem; width: 95%; }
            .blocked-actions { flex-direction: column; }
            .blocked-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="blocked-container">
        <div class="blocked-icon">
            <i class="fas fa-ban"></i>
        </div>
        
        <h1 class="blocked-title">Account Suspended</h1>
        <p class="blocked-username" id="username">Loading...</p>

        <div class="blocked-reason-container">
            <div class="blocked-reason" id="banReason">
                Loading ban information...
            </div>
        </div>

        <div class="blocked-actions">
            <a href="app.html" class="blocked-btn primary">
                <i class="fas fa-arrow-left"></i>
                Return to Login
            </a>
            <a href="https://xorbit.org/support" target="_blank" class="blocked-btn secondary">
                <i class="fas fa-headset"></i>
                Contact Support
            </a>
        </div>

        <div class="footer-text">
            If you believe this is an error, please contact support.
        </div>
    </div>

    <script>
        // Load ban information
        function loadBanInfo() {
            try {
                // Get ban reason from session storage
                const banReason = sessionStorage.getItem('ban_reason');
                const username = sessionStorage.getItem('banned_username');

                // Update username
                if (username) {
                    document.getElementById('username').textContent = username;
                } else {
                    document.getElementById('username').textContent = 'User Account';
                }

                // Update ban reason
                if (banReason) {
                    document.getElementById('banReason').textContent = banReason;
                } else {
                    document.getElementById('banReason').textContent = 
                        'Your account has been suspended. Please contact support for more information.';
                }

                // Clear session storage after loading
                sessionStorage.removeItem('xorbit_auth_session');
                localStorage.removeItem('xorbit_auth_session');
                
            } catch (error) {
                console.error('Error loading ban info:', error);
                document.getElementById('username').textContent = 'User Account';
                document.getElementById('banReason').textContent = 
                    'Your account has been suspended. Please contact support for more information.';
            }
        }

        // Initialize page
        function init() {
            loadBanInfo();
        }

        // Run on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
