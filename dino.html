<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dino Run</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at top, #1a0033 0%, #0d001a 50%, #000014 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8f0ff;
      user-select: none;
    }

    #score-bar {
      display: flex;
      justify-content: space-between;
      width: 700px;
      max-width: 95vw;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a8b4d9;
      letter-spacing: 0.05em;
    }

    #score-bar span {
      color: #7aaaff;
    }

    #game-container {
      position: relative;
      width: 700px;
      max-width: 95vw;
    }

    canvas {
      display: block;
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(79, 138, 255, 0.25);
      box-shadow:
        0 0 40px rgba(79, 138, 255, 0.2),
        0 16px 32px rgba(0, 0, 0, 0.5),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      outline: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 5, 25, 0.75);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e8f0ff;
      letter-spacing: 0.05em;
    }

    #overlay-sub {
      font-size: 0.85rem;
      color: #a8b4d9;
    }

    #play-btn {
      margin-top: 8px;
      padding: 10px 32px;
      background: #4f8aff;
      border: 1px solid rgba(79, 138, 255, 0.35);
      border-radius: 50px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 20px rgba(79, 138, 255, 0.35);
      transition: all 0.2s ease;
    }

    #play-btn:hover {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(79, 138, 255, 0.5);
    }

    #hint {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div id="score-bar">
  <div>SCORE: <span id="score-display">0</span></div>
  <div>HI: <span id="hi-display">0</span></div>
</div>

<div id="game-container">
  <canvas id="canvas" width="700" height="200" tabindex="0"></canvas>

  <div id="overlay">
    <div id="overlay-title">DINO RUN</div>
    <div id="overlay-sub" style="display:none"></div>
    <button id="play-btn">PLAY</button>
    <div id="hint">Space / Up Arrow / Tap to jump &nbsp;·&nbsp; Down to duck</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub = document.getElementById('overlay-sub');
  const playBtn = document.getElementById('play-btn');
  const scoreDisplay = document.getElementById('score-display');
  const hiDisplay = document.getElementById('hi-display');

  // ── Palette ──────────────────────────────────────────────
  const BG = '#000';
  const GROUND_COLOR = 'rgba(79,138,255,0.2)';
  const DINO_COLOR = '#7aaaff';
  const DINO_EYE = '#000';
  const CACTUS_COLOR = '#4f8aff';
  const CACTUS_HIGHLIGHT = '#93c5fd';
  const CLOUD_COLOR = 'rgba(79,138,255,0.08)';
  const SCORE_COLOR = 'rgba(255,255,255,0.35)';
  const STAR_COLOR = 'rgba(79,138,255,0.2)';
  const BIRD_COLOR = '#7aaaff';

  // ── Constants ────────────────────────────────────────────
  const W = 700, H = 200;
  const GROUND_Y = 160;
  const DINO_X = 60;
  const GRAVITY = 0.6;
  const JUMP_FORCE = -13;
  const DUCK_HEIGHT = 26;
  const STAND_HEIGHT = 44;
  const DINO_W = 32;

  // ── State ────────────────────────────────────────────────
  let state = 'idle'; // idle | playing | dead
  let score = 0;
  let hiScore = 0;
  let speed = 5;
  let frame = 0;
  let raf;

  // Dino
  let dino = {};
  // Obstacles
  let obstacles = [];
  // Birds
  let birds = [];
  // Clouds
  let clouds = [];
  // Stars
  let stars = [];

  // ── Input ────────────────────────────────────────────────
  let keys = { up: false, down: false };

  function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      keys.up = true;
      handleJump();
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      keys.down = true;
    }
  }
  function onKeyUp(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
  }

  // Listen on both canvas and document so keys work regardless of exact focus target
  canvas.addEventListener('keydown', onKeyDown);
  canvas.addEventListener('keyup', onKeyUp);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  canvas.addEventListener('pointerdown', () => {
    canvas.focus();
    handleJump();
  });

  playBtn.addEventListener('click', startGame);

  function handleJump() {
    if (state === 'idle' || state === 'dead') {
      startGame();
      return;
    }
    if (state === 'playing' && dino.onGround) {
      dino.vy = JUMP_FORCE;
      dino.onGround = false;
    }
  }

  // ── Init ─────────────────────────────────────────────────
  function initStars() {
    stars = [];
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (GROUND_Y - 20),
        r: Math.random() * 1.2 + 0.3,
        alpha: Math.random() * 0.6 + 0.2,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 4; i++) {
      clouds.push(spawnCloud(true));
    }
  }

  function spawnCloud(init = false) {
    return {
      x: init ? Math.random() * W : W + 60,
      y: Math.random() * 50 + 20,
      w: Math.random() * 60 + 40,
      speed: Math.random() * 0.8 + 0.3
    };
  }

  function resetGame() {
    dino = {
      x: DINO_X,
      y: GROUND_Y - STAND_HEIGHT,
      vy: 0,
      onGround: true,
      ducking: false,
      legFrame: 0,
      legTimer: 0
    };
    obstacles = [];
    birds = [];
    score = 0;
    speed = 5;
    frame = 0;
    initStars();
    initClouds();
  }

  function startGame() {
    if (raf) cancelAnimationFrame(raf);
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
    canvas.focus();
    loop();
  }

  // ── Spawn logic ───────────────────────────────────────────
  let nextObstacleIn = 80;

  function trySpawnObstacle() {
    nextObstacleIn--;
    if (nextObstacleIn > 0) return;
    nextObstacleIn = Math.floor(Math.random() * 60 + 55 - Math.min(score / 100, 25));

    // Occasionally spawn a bird instead of cactus
    if (score > 200 && Math.random() < 0.25) {
      const yOptions = [GROUND_Y - 60, GROUND_Y - 90, GROUND_Y - 45];
      birds.push({
        x: W + 20,
        y: yOptions[Math.floor(Math.random() * yOptions.length)],
        w: 36, h: 22,
        wingUp: false,
        wingTimer: 0
      });
      return;
    }

    // Cactus: 1–3 spikes
    const count = Math.random() < 0.5 ? 1 : Math.random() < 0.5 ? 2 : 3;
    const spikeW = 14, spikeGap = 4;
    const totalW = count * spikeW + (count - 1) * spikeGap;
    const h = Math.floor(Math.random() * 20 + 30);
    obstacles.push({
      x: W + 10,
      y: GROUND_Y - h,
      w: totalW,
      h,
      count,
      spikeW,
      spikeGap
    });
  }

  // ── Collision ─────────────────────────────────────────────
  function dinoRect() {
    const ducking = keys.down && dino.onGround;
    const h = ducking ? DUCK_HEIGHT : STAND_HEIGHT;
    const pad = 6;
    return {
      x: dino.x + pad,
      y: GROUND_Y - h + pad,
      w: DINO_W - pad * 2,
      h: h - pad * 2
    };
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function checkCollisions() {
    const dr = dinoRect();
    for (const o of obstacles) {
      if (rectsOverlap(dr, { x: o.x, y: o.y, w: o.w, h: o.h })) return true;
    }
    for (const b of birds) {
      if (rectsOverlap(dr, { x: b.x, y: b.y, w: b.w, h: b.h })) return true;
    }
    return false;
  }

  // ── Update ────────────────────────────────────────────────
  function update() {
    frame++;

    // Speed ramp
    speed = 5 + score * 0.008;

    // Score
    if (frame % 6 === 0) {
      score++;
      scoreDisplay.textContent = score;
      if (score > hiScore) {
        hiScore = score;
        hiDisplay.textContent = hiScore;
      }
    }

    // Dino physics
    const ducking = keys.down && dino.onGround;
    const h = ducking ? DUCK_HEIGHT : STAND_HEIGHT;
    dino.ducking = ducking;

    if (!dino.onGround) {
      dino.vy += GRAVITY;
      dino.y += dino.vy;
    }

    const groundLimit = GROUND_Y - h;
    if (dino.y >= groundLimit) {
      dino.y = groundLimit;
      dino.vy = 0;
      dino.onGround = true;
    }

    // Leg animation
    if (dino.onGround && !ducking) {
      dino.legTimer++;
      if (dino.legTimer >= Math.max(2, 6 - speed * 0.3)) {
        dino.legFrame = (dino.legFrame + 1) % 2;
        dino.legTimer = 0;
      }
    }

    // Clouds
    for (const c of clouds) c.x -= c.speed;
    if (clouds.length < 5 && Math.random() < 0.008) clouds.push(spawnCloud());
    for (let i = clouds.length - 1; i >= 0; i--) {
      if (clouds[i].x + clouds[i].w < -10) clouds.splice(i, 1);
    }

    // Stars twinkle
    for (const s of stars) s.twinkle += 0.05;

    // Obstacles
    for (const o of obstacles) o.x -= speed;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      if (obstacles[i].x + obstacles[i].w < -10) obstacles.splice(i, 1);
    }

    // Birds
    for (const b of birds) {
      b.x -= speed * 0.85;
      b.wingTimer++;
      if (b.wingTimer >= 10) { b.wingUp = !b.wingUp; b.wingTimer = 0; }
    }
    for (let i = birds.length - 1; i >= 0; i--) {
      if (birds[i].x + birds[i].w < -10) birds.splice(i, 1);
    }

    trySpawnObstacle();

    // Collision
    if (checkCollisions()) {
      state = 'dead';
      overlayTitle.textContent = 'GAME OVER';
      overlaySub.textContent = 'Score: ' + score;
      overlaySub.style.display = 'block';
      playBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }
  }

  // ── Draw helpers ──────────────────────────────────────────
  function drawRoundRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawCloud(c) {
    ctx.fillStyle = CLOUD_COLOR;
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.3, c.y + 10, c.w * 0.3, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.6, c.y + 8, c.w * 0.28, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.45, c.y + 14, c.w * 0.4, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStar(s) {
    const alpha = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
    ctx.fillStyle = `rgba(200,180,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDino(d) {
    const ducking = d.ducking;
    const h = ducking ? DUCK_HEIGHT : STAND_HEIGHT;
    const baseY = GROUND_Y;
    const bodyX = d.x;
    const bodyY = baseY - h;

    if (ducking) {
      // Ducking body: wide, low
      drawRoundRect(bodyX, bodyY, 46, DUCK_HEIGHT, 6, DINO_COLOR);
      // Eye
      ctx.fillStyle = DINO_EYE;
      ctx.beginPath();
      ctx.arc(bodyX + 36, bodyY + 7, 3, 0, Math.PI * 2);
      ctx.fill();
      // Tail
      ctx.fillStyle = DINO_COLOR;
      ctx.beginPath();
      ctx.moveTo(bodyX, bodyY + 10);
      ctx.lineTo(bodyX - 12, bodyY + 18);
      ctx.lineTo(bodyX, bodyY + DUCK_HEIGHT);
      ctx.fill();
    } else {
      // Body
      drawRoundRect(bodyX, bodyY + 14, DINO_W, 22, 5, DINO_COLOR);
      // Head
      drawRoundRect(bodyX + 6, bodyY, 24, 16, 5, DINO_COLOR);
      // Eye
      ctx.fillStyle = DINO_EYE;
      ctx.beginPath();
      ctx.arc(bodyX + 24, bodyY + 5, 3.5, 0, Math.PI * 2);
      ctx.fill();
      // Mouth nub
      drawRoundRect(bodyX + 28, bodyY + 10, 4, 3, 2, DINO_COLOR);
      // Tail
      ctx.fillStyle = DINO_COLOR;
      ctx.beginPath();
      ctx.moveTo(bodyX, bodyY + 20);
      ctx.lineTo(bodyX - 14, bodyY + 30);
      ctx.lineTo(bodyX - 8, bodyY + 36);
      ctx.lineTo(bodyX, bodyY + 36);
      ctx.fill();
      // Legs
      const legY = baseY - 12;
      const l = d.legFrame;
      if (!d.onGround) {
        // Mid-air: legs spread
        drawRoundRect(bodyX + 6, legY, 8, 12, 3, DINO_COLOR);
        drawRoundRect(bodyX + 18, legY - 4, 8, 12, 3, DINO_COLOR);
      } else {
        // Running cycle
        if (l === 0) {
          drawRoundRect(bodyX + 6, legY, 8, 12, 3, DINO_COLOR);
          drawRoundRect(bodyX + 18, legY - 6, 8, 10, 3, DINO_COLOR);
        } else {
          drawRoundRect(bodyX + 6, legY - 6, 8, 10, 3, DINO_COLOR);
          drawRoundRect(bodyX + 18, legY, 8, 12, 3, DINO_COLOR);
        }
      }
    }
  }

  function drawCactus(o) {
    const { x, y, w, h, count, spikeW, spikeGap } = o;
    for (let i = 0; i < count; i++) {
      const cx = x + i * (spikeW + spikeGap);
      // Main spike
      ctx.fillStyle = CACTUS_COLOR;
      ctx.beginPath();
      ctx.roundRect(cx, y, spikeW, h, [4, 4, 0, 0]);
      ctx.fill();
      // Highlight edge
      ctx.fillStyle = CACTUS_HIGHLIGHT;
      ctx.fillRect(cx + 2, y + 4, 3, h - 8);
      // Arms (only on single/first spike for multi)
      if (count === 1 || i === 0) {
        const armY = y + h * 0.35;
        ctx.fillStyle = CACTUS_COLOR;
        ctx.beginPath();
        ctx.roundRect(cx - 8, armY, 8, 6, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(cx - 8, armY - 10, 4, 12, 2);
        ctx.fill();
        ctx.fillStyle = CACTUS_COLOR;
        ctx.beginPath();
        ctx.roundRect(cx + spikeW, armY + 4, 8, 6, 3);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(cx + spikeW + 4, armY - 6, 4, 12, 2);
        ctx.fill();
      }
    }
  }

  function drawBird(b) {
    const { x, y, w, h, wingUp } = b;
    ctx.strokeStyle = BIRD_COLOR;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';

    // Body oval
    ctx.fillStyle = BIRD_COLOR;
    ctx.beginPath();
    ctx.ellipse(x + w * 0.45, y + h * 0.55, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    const wingOffset = wingUp ? -6 : 4;
    ctx.beginPath();
    ctx.moveTo(x + 14, y + h * 0.5);
    ctx.quadraticCurveTo(x + 6, y + h * 0.5 + wingOffset, x, y + h * 0.55 + wingOffset * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 22, y + h * 0.5);
    ctx.quadraticCurveTo(x + 30, y + h * 0.5 + wingOffset, x + 36, y + h * 0.55 + wingOffset * 0.5);
    ctx.stroke();

    // Beak
    ctx.fillStyle = '#f4b942';
    ctx.beginPath();
    ctx.moveTo(x + 34, y + h * 0.5);
    ctx.lineTo(x + 40, y + h * 0.52);
    ctx.lineTo(x + 34, y + h * 0.6);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x + 32, y + h * 0.46, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Ground segments ───────────────────────────────────────
  let groundDots = [];
  function initGroundDots() {
    groundDots = [];
    for (let i = 0; i < 30; i++) {
      groundDots.push({
        x: Math.random() * W,
        w: Math.random() * 8 + 2,
        h: Math.random() * 2 + 1
      });
    }
  }
  initGroundDots();

  function updateGroundDots() {
    for (const d of groundDots) {
      d.x -= speed;
      if (d.x + d.w < 0) {
        d.x = W + Math.random() * 20;
        d.w = Math.random() * 8 + 2;
      }
    }
  }

  // ── Draw ──────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) drawStar(s);

    // Clouds
    for (const c of clouds) drawCloud(c);

    // Ground line
    ctx.fillStyle = GROUND_COLOR;
    ctx.fillRect(0, GROUND_Y, W, 2);

    // Ground texture dots
    ctx.fillStyle = 'rgba(79,138,255,0.2)';
    for (const d of groundDots) ctx.fillRect(d.x, GROUND_Y + 3, d.w, d.h);

    // Obstacles
    for (const o of obstacles) drawCactus(o);

    // Birds
    for (const b of birds) drawBird(b);

    // Dino
    drawDino(dino);

    // Score flash every 100
    if (score > 0 && score % 100 === 0 && frame % 20 < 10) {
      ctx.fillStyle = 'rgba(124,58,237,0.25)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ── Loop ─────────────────────────────────────────────────
  function loop() {
    if (state !== 'playing') return;
    update();
    updateGroundDots();
    draw();
    raf = requestAnimationFrame(loop);
  }

  // ── Idle draw ─────────────────────────────────────────────
  function idleDraw() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) { s.twinkle += 0.03; drawStar(s); }
    for (const c of clouds) { c.x -= c.speed * 0.4; if (c.x + c.w < -10) { c.x = W + 20; c.y = Math.random() * 50 + 20; } drawCloud(c); }
    ctx.fillStyle = GROUND_COLOR;
    ctx.fillRect(0, GROUND_Y, W, 2);
    dino.legTimer++;
    if (dino.legTimer >= 8) { dino.legFrame = (dino.legFrame + 1) % 2; dino.legTimer = 0; }
    drawDino(dino);
    if (state === 'idle' || state === 'dead') requestAnimationFrame(idleDraw);
  }

  // Init idle state
  resetGame();
  canvas.focus();
  idleDraw();
</script>
</body>
</html>
